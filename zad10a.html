
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Trzecia tabela</title>
<style>
    table {
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 30px;
    }

    td {
        border: 1px solid black;
        width: 65px;
        height: 55px;
        font-size: 18px;
    }

    .naglowek {
        background-color: #b9e3f5;
    }

    .zielony {
        background-color: #c5d9a5;
    }
</style>
</head>
<body>

<table>
    <tr>
        <td class="naglowek">1</td>
        <td class="naglowek">2</td>
        <td class="naglowek">3</td>
        <td class="naglowek">4</td>
        <td class="naglowek">5</td>
        <td class="naglowek">6</td>
    </tr>

    <tr>
        <td class="naglowek">2</td>
        <td class="zielony" colspan="2" rowspan="2">
            a, b, f, g
        </td>
        <td>c</td>
        <td>d</td>
        <td>e</td>
    </tr>

    <tr>
        <td class="naglowek">3</td>
        <td>h</td>
        <td>i</td>
        <td>j</td>
    </tr>

    <tr>
        <td class="naglowek">4</td>
        <td>k</td>
        <td>l</td>
        <td>m</td>
        <td>n</td>
        <td>o</td>
    </tr>

    <tr>
        <td class="naglowek">5</td>
        <td>p</td>
        <td>q</td>
        <td>r</td>
        <td>s</td>
        <td>t</td>
    </tr>

    <tr>
        <td class="naglowek">6</td>
        <td>u</td>
        <td>v</td>
        <td>w</td>
        <td>y</td>
        <td>z</td>
    </tr>
</table>

</body>
</html>
